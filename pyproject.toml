[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emipredict-ai"
version = "0.1.0"
description = "Financial risk and EMI affordability assessment platform."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Proprietary - portfolio project" }
authors = [{ name = "EMIPredict AI contributors" }]
dependencies = [
    "numpy>=1.25,<3.0",
    "pandas>=2.0,<3.0",
    "scipy>=1.9,<2.0",
    "scikit-learn>=1.3,<2.0",
    "matplotlib>=3.7,<4.0",
    "xgboost>=1.7,<4.0",
    "shap>=0.49,<1.0",
    "mlflow>=3.0,<4.0",
    "streamlit==1.62.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "pydantic>=2.7,<3.0",
    "joblib>=1.3,<2.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
